name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: meta-mangabaka

      # The SDK comes from a sibling meta checkout (see go.mod).
      - uses: actions/checkout@v5
        with:
          repository: panelarr/meta
          ref: main
          path: meta

      - uses: actions/setup-go@v6
        with:
          go-version-file: meta-mangabaka/go.mod
          cache-dependency-path: meta-mangabaka/go.sum

      - uses: github/codeql-action/init@v3
        with:
          languages: go
          build-mode: manual
          source-root: meta-mangabaka

      - name: Build
        working-directory: meta-mangabaka
        run: go build ./...

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:go
